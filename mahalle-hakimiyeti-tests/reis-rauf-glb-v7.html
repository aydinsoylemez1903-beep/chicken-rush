<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reis Rauf GLB v7</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#080a0e;font-family:system-ui;color:#fff}canvas{display:block;width:100%;height:100%;touch-action:none}#ui{position:fixed;z-index:10;left:12px;top:12px;max-width:min(92vw,430px);padding:12px 14px;border-radius:14px;background:#0e1117dd;border:1px solid #ffffff22}#ui b{font-size:15px}#ui p{font-size:12px;color:#c8cfda;line-height:1.35}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}button{background:#202733;color:#fff;border:1px solid #ffffff22;padding:8px 10px;border-radius:10px;font-weight:700}input{width:120px}#badge{position:fixed;z-index:10;right:12px;bottom:12px;background:#0e1117cc;padding:8px 10px;border-radius:10px;font-size:11px}#err{display:none;position:fixed;z-index:20;left:12px;right:12px;bottom:70px;background:#541515;color:#fff;padding:12px;border-radius:10px;font:12px monospace;white-space:pre-wrap}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"}}</script></head><body><div id="ui"><b>REİS RAUF — GLB RIG TESTİ v7</b><p>Safari clone hatası kaldırıldı. İki karakter ayrı GLB yüklemesiyle oluşturuluyor; rig WeakMap’te tutuluyor.</p><div class="row"><button id="pause">Duraklat</button><button id="cam">Kamera: Arena</button><label>Hız <input id="speed" type="range" min="0.65" max="1.35" step="0.05" value="1"></label></div></div><div id="badge">v7 • Reis Rauf .glb • clone fix</div><div id="err"></div><script type="module">import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';const err=document.getElementById('err'),fail=e=>{err.style.display='block';err.textContent='HATA: '+(e?.stack||e)};addEventListener('error',e=>fail(e.error||e.message));addEventListener('unhandledrejection',e=>fail(e.reason));try{const scene=new THREE.Scene();scene.background=new THREE.Color(0x080a0e);scene.fog=new THREE.Fog(0x080a0e,18,42);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);const camera=new THREE.PerspectiveCamera(47,innerWidth/innerHeight,.1,100);camera.position.set(0,11.5,16);camera.lookAt(0,1.7,0);scene.add(new THREE.HemisphereLight(0xaab7d8,0x211812,1.9));const key=new THREE.DirectionalLight(0xffe1bc,3.2);key.position.set(-5,11,8);scene.add(key);const rim=new THREE.DirectionalLight(0x6a88ff,2);rim.position.set(8,6,-7);scene.add(rim);const ground=new THREE.Mesh(new THREE.PlaneGeometry(18,30),new THREE.MeshStandardMaterial({color:0x161a20,roughness:.92}));ground.rotation.x=-Math.PI/2;scene.add(ground);const line=new THREE.Mesh(new THREE.PlaneGeometry(16,.07),new THREE.MeshBasicMaterial({color:0xcba35d,transparent:true,opacity:.28}));line.rotation.x=-Math.PI/2;line.position.y=.005;scene.add(line);for(const x of[-4.2,4.2]){const l=new THREE.Mesh(new THREE.PlaneGeometry(.05,28),new THREE.MeshBasicMaterial({color:0x8090a6,transparent:true,opacity:.13}));l.rotation.x=-Math.PI/2;l.position.set(x,.007,0);scene.add(l)}const loader=new GLTFLoader(),rigMap=new WeakMap(),actors=[];function bind(root){const g=n=>root.getObjectByName(n),r={pelvis:g('Pelvis'),spine:g('Spine'),neck:g('Neck'),shoulderL:g('ShoulderL'),shoulderR:g('ShoulderR'),elbowL:g('ElbowL'),elbowR:g('ElbowR'),hipL:g('HipL'),hipR:g('HipR'),kneeL:g('KneeL'),kneeR:g('KneeR'),ankleL:g('AnkleL'),ankleR:g('AnkleR'),footL:g('FootL'),footR:g('FootR')};for(const[k,v]of Object.entries(r))if(!v)throw new Error('Eksik rig node: '+k);rigMap.set(root,r);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}})}async function spawn(x,z,ry,dir,phase){const gltf=await loader.loadAsync('./assets/reis_rauf_game_rig_v1.glb');const o=gltf.scene;bind(o);o.position.set(x,0,z);o.rotation.y=ry;scene.add(o);actors.push({o,dir,phase})}await spawn(-2.15,8.3,Math.PI,-1,0);await spawn(2.15,-8.3,0,1,.5);function footCycle(p){const stance=.6,front=.3,back=-.3;let z=0,lift=0,pitch=0,knee=0;if(p<stance){const u=p/stance,s=u*u*(3-2*u);z=front+(back-front)*s;pitch=.13-.34*s;knee=.10+.07*Math.sin(s*Math.PI)}else{const u=(p-stance)/(1-stance),s=u*u*(3-2*u);z=back+(front-back)*s;lift=.16*Math.sin(s*Math.PI);pitch=-.05+.21*s-.12*Math.sin(s*Math.PI);knee=.15+.46*Math.sin(s*Math.PI)}return{z,lift,pitch,knee}}function leg(h,k,a,f,s,m){const hs=s.z*.95*m;h.rotation.x=hs;k.rotation.x=-(s.knee+Math.max(0,-s.z)*.1)*m;a.position.y=-.84+s.lift*m;a.position.z=s.z*.42*m;a.rotation.x=(-hs*.16+s.pitch)*m;f.rotation.x=-s.pitch*.34*m}let speed=1,paused=false,close=false,elapsed=0;function anim(o,t,m=1){const r=rigMap.get(o),hz=1.42*speed,c=(t*hz)%1,L=footCycle(c),R=footCycle((c+.5)%1),w=Math.sin(c*Math.PI*2);r.pelvis.position.y=1.85+(0.015+.022*Math.cos(c*Math.PI*4))*m;r.pelvis.rotation.z=.032*w*m;r.pelvis.rotation.y=.038*w*m;r.spine.rotation.y=-.065*w*m;r.spine.rotation.z=-.012*w*m;r.neck.rotation.y=.022*w*m;leg(r.hipL,r.kneeL,r.ankleL,r.footL,L,m);leg(r.hipR,r.kneeR,r.ankleR,r.footR,R,m);const aL=R.z*.72*m,aR=L.z*.72*m;r.shoulderL.rotation.x=aL;r.shoulderR.rotation.x=aR;r.elbowL.rotation.x=-(.14+Math.max(0,aL)*.1)*m;r.elbowR.rotation.x=-(.14+Math.max(0,aR)*.1)*m}pause.onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'Devam et':'Duraklat'};speed.oninput=e=>{window.speed=+e.target.value};document.getElementById('speed').oninput=e=>speed=+e.target.value;cam.onclick=e=>{close=!close;e.currentTarget.textContent=close?'Kamera: Yakın':'Kamera: Arena'};const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);if(!paused)elapsed+=dt;const walk=1.42*speed*.82;if(!paused)for(const A of actors){A.o.position.z+=A.dir*walk*dt;if(A.dir<0&&A.o.position.z<-9.3)A.o.position.z=9.3;if(A.dir>0&&A.o.position.z>9.3)A.o.position.z=-9.3}for(const A of actors)anim(A.o,elapsed+A.phase/(1.42*speed),paused?0:1);camera.position.lerp(new THREE.Vector3(0,close?6.2:11.5,close?9.2:16),.06);camera.lookAt(0,1.8,0);renderer.render(scene,camera)}loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})}catch(e){fail(e)}</script></body></html>
