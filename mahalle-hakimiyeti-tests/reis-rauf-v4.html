<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Mahalle Hâkimiyeti — Reis Rauf 3D Entegrasyon v4</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#090b10;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#ui{position:fixed;z-index:10;left:12px;top:12px;max-width:min(92vw,430px);padding:12px 14px;border-radius:14px;color:#fff;background:rgba(14,17,23,.82);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(8px)}
#ui b{font-size:15px}#ui p{font-size:12px;line-height:1.35;color:#c8cfda;margin:6px 0 10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{border:1px solid rgba(255,255,255,.14);background:#202733;color:#fff;padding:8px 10px;border-radius:10px;font-weight:700}label{font-size:12px;color:#c8cfda}input{width:120px}
#badge{position:fixed;right:12px;bottom:12px;color:#dce2ec;background:rgba(14,17,23,.75);padding:8px 10px;border-radius:10px;font-size:11px}
canvas{display:block;width:100%;height:100%;touch-action:none}
</style>
</head>
<body>
<div id="ui"><b>MAHALLE HÂKİMİYETİ — REİS RAUF 3D v4</b><p>v3 yürüyüş sistemi korundu. Sol koridordaki karakter artık Reis Rauf: deri ceket, geniş Patron/Tank gövde, sakal, saç, bot ve altın detaylarla 3D oyun modeli.</p><div class="row"><button id="pause">Duraklat</button><button id="cam">Kamera: Arena</button><label>Hız <input id="speed" type="range" min="0.65" max="1.35" step="0.05" value="1"></label></div></div>
<div id="badge">v4 • Reis Rauf 3D • v3 yürüyüş rig’i</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js';

const scene=new THREE.Scene();scene.background=new THREE.Color(0x090b10);scene.fog=new THREE.Fog(0x090b10,18,44);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.appendChild(renderer.domElement);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,100);camera.position.set(0,11.5,16.5);camera.lookAt(0,1.6,0);
scene.add(new THREE.HemisphereLight(0xaab8d8,0x1a1410,1.8));const dl=new THREE.DirectionalLight(0xffe6c9,2.5);dl.position.set(-5,11,7);dl.castShadow=true;scene.add(dl);const rim=new THREE.DirectionalLight(0x6688ff,1.8);rim.position.set(7,5,-8);scene.add(rim);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(18,30),new THREE.MeshStandardMaterial({color:0x171a20,roughness:.92}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
for(const x of [-4.2,4.2]){const l=new THREE.Mesh(new THREE.PlaneGeometry(.05,28),new THREE.MeshBasicMaterial({color:0x8793a8,transparent:true,opacity:.18}));l.rotation.x=-Math.PI/2;l.position.set(x,.006,0);scene.add(l)}
const mid=new THREE.Mesh(new THREE.PlaneGeometry(16,.06),new THREE.MeshBasicMaterial({color:0xd9b765,transparent:true,opacity:.35}));mid.rotation.x=-Math.PI/2;mid.position.y=.007;scene.add(mid);

const M=(c,r=.75)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const skin=M(0xd6a077,.85),dark=M(0x1e2229,.9),pants=M(0x2a3038,.9),shoe=M(0x101216,.85);
function box(w,h,d,c){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d,2,2,2),M(c));m.castShadow=true;return m}
function sphere(r,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat);m.castShadow=true;return m}
function limb(len,rad,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,10),mat);m.castShadow=true;return m}
function placeSegment(mesh,a,b){const v=new THREE.Vector3().subVectors(b,a),len=v.length();mesh.position.copy(a).add(b).multiplyScalar(.5);mesh.scale.y=len;mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),v.clone().normalize())}
function lerp(a,b,t){return a+(b-a)*t}function smooth(t){return t*t*(3-2*t)}

function makeRauf(){
 const root=new THREE.Group();
 const body=new THREE.Group();root.add(body);
 const leather=M(0x241c19,.72),gold=M(0xb9923e,.45);
 const skinR=M(0xc98e69,.86),beardM=M(0x2a2524,.95),hairM=M(0x262221,.9),trouserM=M(0x202329,.92);
 const pelvis=box(.82,.38,.48,0x202329);pelvis.position.set(0,1.94,0);body.add(pelvis);
 const torso=box(1.20,1.20,.62,0x241c19);torso.position.set(0,2.70,0);body.add(torso);
 const shirtFront=box(.72,.92,.05,0x101214);shirtFront.position.set(0,2.66,.335);body.add(shirtFront);
 const lapelL=box(.24,.78,.07,0x322723);lapelL.position.set(-.25,2.76,.37);lapelL.rotation.z=-.16;body.add(lapelL);
 const lapelR=box(.24,.78,.07,0x322723);lapelR.position.set(.25,2.76,.37);lapelR.rotation.z=.16;body.add(lapelR);
 const belt=box(.86,.12,.54,0x111214);belt.position.set(0,2.06,0);body.add(belt);
 const buckle=box(.22,.16,.07,0xb9923e);buckle.position.set(0,2.06,.305);body.add(buckle);
 const head=sphere(.37,skinR);head.scale.set(.96,1.08,.94);head.position.set(0,3.70,0);body.add(head);
 const hair=sphere(.37,hairM);hair.scale.set(.98,.48,.96);hair.position.set(0,3.94,-.015);body.add(hair);
 const templeL=box(.055,.22,.06,0x77706d);templeL.position.set(-.31,3.88,.12);body.add(templeL);
 const templeR=box(.055,.22,.06,0x77706d);templeR.position.set(.31,3.88,.12);body.add(templeR);
 const browL=box(.18,.045,.045,0x201b1a);browL.position.set(-.14,3.77,.345);browL.rotation.z=.10;body.add(browL);
 const browR=box(.18,.045,.045,0x201b1a);browR.position.set(.14,3.77,.345);browR.rotation.z=-.10;body.add(browR);
 const eyeMat=M(0x171719,.6);const eyeL=sphere(.035,eyeMat),eyeR=sphere(.035,eyeMat);eyeL.position.set(-.13,3.72,.355);eyeR.position.set(.13,3.72,.355);body.add(eyeL,eyeR);
 const nose=new THREE.Mesh(new THREE.ConeGeometry(.075,.19,10),skinR);nose.rotation.x=Math.PI/2;nose.position.set(0,3.67,.39);body.add(nose);
 const moust=box(.34,.085,.07,0x2a2524);moust.position.set(0,3.55,.37);body.add(moust);
 const beard=sphere(.30,beardM);beard.scale.set(.92,.72,.60);beard.position.set(0,3.43,.25);body.add(beard);
 const beardCut=box(.46,.18,.18,0x2a2524);beardCut.position.set(0,3.46,.29);body.add(beardCut);
 const chain=new THREE.Mesh(new THREE.TorusGeometry(.21,.018,8,24,Math.PI*1.18),gold);chain.rotation.x=Math.PI/2;chain.rotation.z=.91;chain.position.set(0,3.10,.355);body.add(chain);
 const shL=sphere(.24,leather);shL.scale.set(1.45,.72,1.1);shL.position.set(-.57,3.15,0);body.add(shL);
 const shR=sphere(.24,leather);shR.scale.set(1.45,.72,1.1);shR.position.set(.57,3.15,0);body.add(shR);
 const upperL=limb(1,.19,trouserM), lowerL=limb(1,.17,trouserM), upperR=limb(1,.19,trouserM), lowerR=limb(1,.17,trouserM);body.add(upperL,lowerL,upperR,lowerR);
 const kneeL=sphere(.16,trouserM),kneeR=sphere(.16,trouserM);body.add(kneeL,kneeR);
 const footL=box(.40,.23,.68,0x0d0e10),footR=box(.40,.23,.68,0x0d0e10);body.add(footL,footR);
 const armUL=limb(1,.15,leather),armLL=limb(1,.135,skinR),armUR=limb(1,.15,leather),armLR=limb(1,.135,skinR);body.add(armUL,armLL,armUR,armLR);
 const handL=sphere(.15,skinR),handR=sphere(.15,skinR);body.add(handL,handR);
 const ring=sphere(.045,gold);body.add(ring);
 const chest=box(.18,.18,.055,0xb9923e);chest.position.set(.36,2.92,.35);body.add(chest);
 const back=box(.70,.05,.07,0x0f1012);back.position.set(0,2.78,-.35);body.add(back);
 root.userData.rig={body,pelvis,torso,head,hair,nose,chest,back,upperL,lowerL,upperR,lowerR,kneeL,kneeR,footL,footR,armUL,armLL,armUR,armLR,handL,handR,ring};
 return root;
}
function makeEnemy(){
 const root=new THREE.Group(),body=new THREE.Group();root.add(body);const primary=0x8e3535,accent=0xd7b45d;
 const pelvis=box(.72,.34,.42,primary);pelvis.position.set(0,1.92,0);body.add(pelvis);
 const torso=box(.98,1.18,.50,primary);torso.position.set(0,2.68,0);body.add(torso);
 const head=sphere(.34,skin);head.position.set(0,3.65,0);body.add(head);const hair=sphere(.34,dark);hair.scale.set(.94,.55,.94);hair.position.set(0,3.86,0);body.add(hair);
 const nose=new THREE.Mesh(new THREE.ConeGeometry(.07,.18,10),skin);nose.rotation.x=Math.PI/2;nose.position.set(0,3.65,.35);body.add(nose);
 const chest=box(.26,.26,.05,accent);chest.position.set(0,2.76,.28);body.add(chest);const back=box(.48,.52,.08,0x161a20);back.position.set(0,2.64,-.30);body.add(back);
 const upperL=limb(1,.16,pants), lowerL=limb(1,.14,pants), upperR=limb(1,.16,pants), lowerR=limb(1,.14,pants);body.add(upperL,lowerL,upperR,lowerR);
 const kneeL=sphere(.14,dark),kneeR=sphere(.14,dark);body.add(kneeL,kneeR);const footL=box(.32,.20,.56,0x101216),footR=box(.32,.20,.56,0x101216);body.add(footL,footR);
 const armUL=limb(1,.12,M(primary)),armLL=limb(1,.11,skin),armUR=limb(1,.12,M(primary)),armLR=limb(1,.11,skin);body.add(armUL,armLL,armUR,armLR);const handL=sphere(.13,skin),handR=sphere(.13,skin);body.add(handL,handR);
 root.userData.rig={body,pelvis,torso,head,hair,nose,chest,back,upperL,lowerL,upperR,lowerR,kneeL,kneeR,footL,footR,armUL,armLL,armUR,armLR,handL,handR};return root;
}
const poses=[
 {p:0.00,lz:.48,ly:.12,rz:-.40,ry:.12,py:1.94},
 {p:0.125,lz:.30,ly:.10,rz:-.30,ry:.12,py:1.88},
 {p:0.25,lz:.08,ly:.10,rz:-.05,ry:.25,py:1.92},
 {p:0.375,lz:-.18,ly:.11,rz:.27,ry:.30,py:1.99},
 {p:0.50,lz:-.40,ly:.12,rz:.48,ry:.12,py:1.94},
 {p:0.625,lz:-.30,ly:.12,rz:.30,ry:.10,py:1.88},
 {p:0.75,lz:-.05,ly:.25,rz:.08,ry:.10,py:1.92},
 {p:0.875,lz:.27,ly:.30,rz:-.18,ry:.11,py:1.99},
 {p:1.00,lz:.48,ly:.12,rz:-.40,ry:.12,py:1.94}
];
function samplePose(t){t=((t%1)+1)%1;let i=0;while(i<poses.length-1&&t>poses[i+1].p)i++;const a=poses[i],b=poses[i+1],u=smooth((t-a.p)/(b.p-a.p));const out={};for(const k of ['lz','ly','rz','ry','py'])out[k]=lerp(a[k],b[k],u);return out}
function solveLeg(hip,foot){const L1=.92,L2=.86;const dy=foot.y-hip.y,dz=foot.z-hip.z;let d=Math.hypot(dy,dz);d=Math.min(L1+L2-.001,Math.max(Math.abs(L1-L2)+.001,d));const a=(L1*L1-L2*L2+d*d)/(2*d);const h=Math.sqrt(Math.max(0,L1*L1-a*a));const uy=dy/d,uz=dz/d;const baseY=hip.y+a*uy,baseZ=hip.z+a*uz;const py=-uz,pz=uy;let k1={y:baseY+h*py,z:baseZ+h*pz},k2={y:baseY-h*py,z:baseZ-h*pz};const knee=(k1.z>k2.z)?k1:k2;return new THREE.Vector3(hip.x,knee.y,knee.z)}
function animateLeg(r,isLeft,footY,footZ){const x=isLeft?-.25:.25;const hip=new THREE.Vector3(x,1.84,0);const foot=new THREE.Vector3(x,footY,footZ);const knee=solveLeg(hip,foot);const up=isLeft?r.upperL:r.upperR,lo=isLeft?r.lowerL:r.lowerR,ks=isLeft?r.kneeL:r.kneeR,fm=isLeft?r.footL:r.footR;placeSegment(up,hip,knee);placeSegment(lo,knee,foot);ks.position.copy(knee);fm.position.copy(foot);fm.position.y-=.03;fm.rotation.x=footY>.16?-.12:0}
function animateArms(r,phase){const s=Math.sin(phase*Math.PI*2);const shoulderL=new THREE.Vector3(-.60,3.17,0),shoulderR=new THREE.Vector3(.60,3.17,0);const elbowL=new THREE.Vector3(-.64,2.75,-.18*s),elbowR=new THREE.Vector3(.64,2.75,.18*s);const handL=new THREE.Vector3(-.62,2.35,-.32*s),handR=new THREE.Vector3(.62,2.35,.32*s);placeSegment(r.armUL,shoulderL,elbowL);placeSegment(r.armLL,elbowL,handL);placeSegment(r.armUR,shoulderR,elbowR);placeSegment(r.armLR,elbowR,handR);r.handL.position.copy(handL);r.handR.position.copy(handR);if(r.ring){r.ring.position.copy(handR);r.ring.position.x+=.045;r.ring.position.z+=.03}}
function animateCharacter(ch,phase){const r=ch.userData.rig,p=samplePose(phase);animateLeg(r,true,p.ly,p.lz);animateLeg(r,false,p.ry,p.rz);const dy=p.py-1.94;r.pelvis.position.y=1.92+dy;r.torso.position.y=2.68+dy;r.head.position.y=3.65+dy;r.hair.position.y=3.86+dy;r.nose.position.y=3.65+dy;r.chest.position.y=2.76+dy;r.back.position.y=2.64+dy;const sway=Math.sin(phase*Math.PI*2);r.pelvis.rotation.z=.028*sway;r.torso.rotation.y=-.045*sway;animateArms(r,phase)}

const blue=makeRauf(),red=makeEnemy();scene.add(blue,red);
blue.position.set(-2.25,0,8.3);red.position.set(2.25,0,-8.3);blue.rotation.y=Math.PI;red.rotation.y=0;
let paused=false,speedMul=1,close=false,phase=0;const clock=new THREE.Clock();
document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'Devam et':'Duraklat'};document.getElementById('speed').oninput=e=>speedMul=+e.target.value;document.getElementById('cam').onclick=()=>{close=!close;document.getElementById('cam').textContent=close?'Kamera: Yakın':'Kamera: Arena'};
function wrap(z,d){if(d<0&&z<-9.1)return 9.1;if(d>0&&z>9.1)return-9.1;return z}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.033);if(!paused){const cycleHz=1.16*speedMul;phase=(phase+dt*cycleHz)%1;const stride=.88;const worldSpeed=stride*cycleHz;blue.position.z=wrap(blue.position.z-worldSpeed*dt,-1);red.position.z=wrap(red.position.z+worldSpeed*dt,1)}animateCharacter(blue,phase);animateCharacter(red,(phase+.5)%1);const target=close?new THREE.Vector3(0,5.8,8.8):new THREE.Vector3(0,11.5,16.5);camera.position.lerp(target,.06);camera.lookAt(0,close?1.85:1.65,0);renderer.render(scene,camera)}loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script>
</body></html>
